# pytest.ini

[pytest]
testpaths = tests
python_files = test_*.py

# -ra = show short summary for skipped/xfail/xpass (useful when diagnosing CI)
addopts = -ra

# Register custom markers to avoid PytestUnknownMarkWarning
markers =
    unit: fast, pure logic tests (no OR-Tools, no DB)
    integration: component-level tests (e.g. running OR-Tools engine, still no DB / no API)
    solver: tests related to the scheduling solver (engine/objectives/constraints)